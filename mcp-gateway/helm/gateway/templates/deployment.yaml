apiVersion: apps/v1
kind: Deployment
metadata:
  name: urumi-gateway
  labels:
    app: urumi-gateway
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: urumi-gateway
  template:
    metadata:
      labels:
        app: urumi-gateway
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.security.runAsNonRoot }}
        runAsUser: {{ .Values.security.runAsUser }}
        runAsGroup: {{ .Values.security.runAsGroup }}
        fsGroup: {{ .Values.security.runAsGroup }}

      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8003

          env:
            - name: DATABASE_URL
              value: {{ .Values.database.url | quote }}

            - name: WOOCOMMERCE_MCP_URL
              value: {{ .Values.upstreams.woocommerceUrl | quote }}

            - name: INVENTORY_MCP_URL
              value: {{ .Values.upstreams.inventoryUrl | quote }}

            - name: CUSTOMER_SUPPORT_MCP_URL
              value: {{ .Values.upstreams.customerSupportUrl | quote }}

            - name: GATEWAY_BOOTSTRAP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: gateway-bootstrap-secret
                  key: GATEWAY_BOOTSTRAP_ADMIN_EMAIL

            - name: GATEWAY_BOOTSTRAP_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-bootstrap-secret
                  key: GATEWAY_BOOTSTRAP_ADMIN_KEY

            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-secret
                  key: GEMINI_API_KEY

            - name: GEMINI_MODEL
              value: "gemini-3.5-flash-lite"

          volumeMounts:
            - name: gateway-data
              mountPath: /data

            - name: tmp
              mountPath: /tmp

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.security.readOnlyRootFilesystem }}
            capabilities:
              drop:
                - ALL

      volumes:
        - name: gateway-data
          persistentVolumeClaim:
            claimName: urumi-gateway-data

        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
