apiVersion: v1
kind: Service
metadata:
  name: urumi-gateway
  labels:
    app: urumi-gateway
spec:
  type: {{ .Values.service.type }}
  selector:
    app: urumi-gateway
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
