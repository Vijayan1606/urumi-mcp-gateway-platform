replicaCount: 1

image:
  repository: urumi-mcp-gateway
  tag: "1.0.19"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8003
  targetPort: 8003

database:
  url: "sqlite:////data/urumi_gateway.db"
  storageSize: 1Gi
  storageClassName: "local-path"

upstreams:
  woocommerceUrl: "http://woo-mcp.urumi.svc.cluster.local:8000/mcp"
  inventoryUrl: "http://inventory-mcp.urumi.svc.cluster.local:8000/"
  customerSupportUrl: "http://customer-support-mcp.urumi.svc.cluster.local:8000/"

security:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 5
  liveness:
    initialDelaySeconds: 20
    periodSeconds: 10
