replicaCount: 1

image:
  repository: urumi-woo-mcp
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

woocommerce:
  url: "http://wordpress.urumi.svc.cluster.local"

secret:
  name: woo-mcp-secret
  consumerKeyKey: WC_CONSUMER_KEY
  consumerSecretKey: WC_CONSUMER_SECRET

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  initialDelaySeconds: 10
  periodSeconds: 10

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
